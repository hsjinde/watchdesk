[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watchdesk"
version = "0.1.0"
description = "A read-only, on-call AI assistant for a single self-hosted mail server: it watches for change, not for state."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ethan Hsu" }]
keywords = ["sre", "monitoring", "fail2ban", "postfix", "dovecot", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
watchdesk = "watchdesk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/watchdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
