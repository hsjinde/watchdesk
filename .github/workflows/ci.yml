name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The redaction gate is its own job, ahead of everything else, because it is
  # the one failure that must never be merged: this repository is public and
  # the server it watches is not. A red gate here means the pipeline is
  # capable of publishing a real address, and nothing else in the build is
  # worth knowing until that is fixed.
  redaction-gate:
    name: redaction gate (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: No identifier may survive the pipeline
        run: pytest tests/test_redact.py -q

  test:
    name: tests (py${{ matrix.python-version }})
    needs: redaction-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install ruff
      - run: ruff check .

  # The one test that cannot be faked with a file on disk: a real Docker
  # daemon, the real json-file driver, the real CLI, the real `docker exec`
  # path. Every seam between watchdesk and Docker has produced a bug at some
  # point, and none of them are reachable by reading a log off disk.
  fake-stack:
    name: round against a real docker daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Start the replay containers
        run: docker compose -f tests/fake-stack/compose.yml up -d
      - name: Give them a moment to emit
        run: sleep 5
      - name: Collect a round
        run: |
          watchdesk --config tests/fake-stack/watchdesk.yaml once \
            --json --no-state > round.json
      - name: The incident's shape must come through the real pipeline
        run: |
          python - <<'PY'
          import json, sys

          round_ = json.load(open("round.json"))
          signals = {s["key"]: s["value"] for s in round_["signals"]}
          ctr = "watchdesk-fake-postfix"

          # How the log was reachable at all. The runner is not root, so this
          # is normally the `docker logs` fallback — the path a non-root
          # deployment takes, and the one that had a real bug in it.
          print("read mode:", signals.get(f"postfix.log_read_mode{{container={ctr}}}"))

          total = signals.get(f"postfix.auth_failures{{container={ctr}}}")
          sub = signals.get(
              f"postfix.auth_failures_by_service{{container={ctr},service=submission/smtpd}}"
          )
          smtpd = signals.get(f"postfix.auth_failures_by_service{{container={ctr},service=smtpd}}")

          # The containers re-emit the capture on a loop, so the absolute
          # numbers depend on how many times they have looped. The *shape* does
          # not: every emission is 212 failures, 210 of them on submission.
          if not total or total % 212:
              sys.exit(f"expected a multiple of 212 auth failures, got {total}")
          loops = total // 212
          if sub != 210 * loops or smtpd != 2 * loops:
              sys.exit(f"after {loops} loop(s): submission={sub}, smtpd={smtpd}")

          errors = [s for s in round_["signals"] if s["kind"] == "error"]
          if errors:
              sys.exit(f"collection errors: {[e['key'] for e in errors]}")
          print(f"ok: {len(signals)} signals, {loops} replay loop(s), no collection errors")
          PY
      - name: Stop the replay containers
        if: always()
        run: docker compose -f tests/fake-stack/compose.yml down

  # A committed fixture that still contains a real address would be a leak
  # that no runtime check can undo, so the tree itself is scanned as well.
  fixtures-are-clean:
    name: committed fixtures carry no identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Scan tests/fixtures for globally-routable addresses
        run: python scripts/scan_fixtures.py
