# A stack that is fake in exactly one way: the log lines are recorded rather
# than generated by a real Postfix.
#
# Everything else is real. These are real containers, writing to the real
# json-file driver, read through the real docker CLI by the real sources. That
# matters because half the bugs this project has found were in the seam
# between watchdesk and Docker — silent truncation from `docker logs --since`,
# the < escaping the driver applies, the difference between the decoded
# message and the bytes fail2ban matches. A test that reads a log file off
# disk would have found none of them.
#
#   docker compose -f tests/fake-stack/compose.yml up -d
#   watchdesk --config tests/fake-stack/watchdesk.yaml once --sink stdout
#   docker compose -f tests/fake-stack/compose.yml down
#
# The recorded lines are the redacted 2026-07-31 capture, so a round against
# this stack reproduces the incident's shape: authentication failures on the
# submission listener, and nothing counting them.

services:
  postfix:
    image: busybox:1.36
    container_name: watchdesk-fake-postfix
    restart: unless-stopped
    volumes:
      - ./replay:/replay:ro
      # The stub binaries go on PATH rather than being called by full path,
      # so the allowlist in watchdesk.yaml reads exactly as it would in
      # production: (container, ["mailq"]), not (container, ["/some/path"]).
      - ./replay/bin:/usr/local/bin:ro
    # Re-emitted on an interval so that a round run at any time finds lines
    # inside its window. The timestamps that matter are the ones Docker
    # records on receipt, not the ones inside the messages.
    command: ["sh", "-c", "while :; do cat /replay/postfix.log; sleep 120; done"]

  dovecot:
    image: busybox:1.36
    container_name: watchdesk-fake-dovecot
    restart: unless-stopped
    volumes:
      - ./replay:/replay:ro
      - ./replay/bin:/usr/local/bin:ro
    command: ["sh", "-c", "while :; do cat /replay/dovecot.log >&2; sleep 120; done"]
