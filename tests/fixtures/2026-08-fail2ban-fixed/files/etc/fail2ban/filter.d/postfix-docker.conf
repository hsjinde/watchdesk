# Fail2ban filter for Postfix logging through the Docker json-file driver.
# Log lines are wrapped in JSON, e.g.:
#   {"log":"Jun 26 03:22:10 mail.example.com postfix/smtpd[150]: warning: unknown[198.51.100.17]: SASL LOGIN authentication failed: (reason unavailable), sasl_username=royal\n","stream":"stdout","time":"2026-06-26T03:22:10.299Z"}
# The stock `postfix` filter assumes plain syslog lines and matches nothing here.
[Definition]

# NOTE (2026-07-20): the SASL mechanism is matched as [A-Za-z0-9-]+ rather than a
# fixed (?:LOGIN|PLAIN|...) list on purpose. Postfix echoes the mechanism in the
# case the *client* sent it, so this log has 7114 "SASL LOGIN" but also 76
# lowercase "SASL login", plus NTLM/GSSAPI — the old fixed uppercase list silently
# missed all of those (fail2ban regexes are case-sensitive). That gap is why the
# 172.94.9.x prober (sasl_username=info/noauth) was never counted.
#
# FIXED 2026-07-29: was matching only 554 5.7.1, but every "Relay access denied"
# line this container has ever logged is actually 454 4.7.1 — so this rule was
# dead. Now matches both. Safe to enable now that jail.local [DEFAULT] has
# ignoreip = 127.0.0.1/8 ::1 172.19.0.0/16, which protects the
# postfixmanager_mailnet gateway (172.19.0.1) that nginx's stream proxy
# (2525→25, 8443→110) hands external connections to — without that, this rule
# could have banned the gateway itself and cut off remote mail.example.com access.
#
# FIXED 2026-08-01: the service part was `postfix/\w+`, which only matches the
# port-25 process name `postfix/smtpd`. Postfix names the submission/smtps
# listeners `postfix/submission/smtpd` and `postfix/smtps/smtpd` — the extra
# slash is not \w, so every auth failure on ports 587/465 was invisible to this
# jail. All-time tally: 12882 lines from postfix/smtpd (matched) vs 784
# postfix/submission/smtpd + 53 postfix/smtps/smtpd (missed). The attackers had
# migrated to 587: in Jul 25 - Aug 01 alone it was 763 submission + 49 smtps vs
# only 35 on port 25. Now matches an optional extra path segment.
failregex = ^\{"log":".*?\bpostfix/(?:\w+/)?\w+\[\d+\]: warning: [^[]*\[<HOST>\](?::\d+)?: SASL [A-Za-z0-9-]+ authentication failed
            ^\{"log":".*?\bpostfix/(?:\w+/)?\w+\[\d+\]: NOQUEUE: reject: RCPT from [^[]*\[<HOST>\](?::\d+)?: (?:454 4|554 5)\.7\.1 .*Relay access denied

ignoreregex =

datepattern = %%b %%d %%H:%%M:%%S
