# Fail2ban filter for Dovecot logging through the Docker json-file driver.
# Log lines are wrapped in JSON, e.g.:
#   {"log":"Jul 08 00:43:42 imap-login: Info: Disconnected: Connection closed (auth failed, 1 attempts in 4 secs): user=<testuser>, method=PLAIN, rip=198.51.100.17, lip=172.19.0.3, secured, session=<...>\n","stream":"stderr","time":"2026-07-08T00:43:42.06Z"}
# The stock `dovecot` filter assumes plain syslog/journal lines and matches nothing here.
[Definition]

failregex = ^\{"log":".*?\b(?:pop3|imap|managesieve|submission)-login: Info: (?:Aborted login|Disconnected|Remote closed connection|Client has quit the connection)(?::(?: [^ \(]+)+)? \((?:auth failed, \d+ attempts(?: in \d+ secs)?|tried to use (?:disabled|disallowed) \S+ auth|proxy dest auth failed)\):(?: user=(?:<|\\u003c)[^>]*(?:>|\\u003e),)?(?: method=\S+,)? rip=<HOST>

ignoreregex =

datepattern = %%b %%d %%H:%%M:%%S
